name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: fatiguesense
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest

      - name: Wait for MySQL
        run: |
          python - <<'PY'
          import time
          import pymysql

          for i in range(30):
              try:
                  connection = pymysql.connect(
                      host="127.0.0.1",
                      port=3306,
                      user="root",
                      password="password",
                      database="fatiguesense"
                  )
                  connection.close()
                  print("MySQL is ready")
                  break
              except Exception as e:
                  print(f"Waiting for MySQL... {i + 1}/30")
                  time.sleep(2)
          else:
              raise RuntimeError("MySQL did not become ready")
          PY

      - name: Create MySQL tables
        env:
          PYTHONPATH: backend
          MYSQL_URL: mysql+pymysql://root:password@127.0.0.1:3306/fatiguesense
        run: |
          python backend/scripts/setup_mysql.py

      - name: Run tests
        env:
          PYTHONPATH: backend
          MYSQL_URL: mysql+pymysql://root:password@127.0.0.1:3306/fatiguesense
        run: |
          python -m pytest backend/tests -v